stages:
  churn_dataset:
    cmd: python -m churn_detection.churn_dataset
    deps:
      - churn_detection/churn_dataset.py
      - churn_detection/membership_utils.py
      - data/raw/personas.csv
      - data/raw/inscripciones.csv
      - data/raw/servicios.csv
      - data/raw/registros_acceso.csv
      - data/raw/ventas_servicios.csv
    outs:
      - data/processed/churn_ciclos.csv

  churn_eda:
    cmd: python -m churn_detection.churn_plots
    deps:
      - churn_detection/churn_plots.py
      - data/processed/churn_ciclos.csv
    outs:
      - reports/figures/08_churn_estado_ciclo.png
      - reports/figures/09_churn_missingness.png
      - reports/figures/10_churn_distribuciones_por_label.png
      - reports/figures/11_churn_correlacion.png

  train_churn_model:
    cmd: python -m churn_detection.modeling.train
    deps:
      - churn_detection/modeling/train.py
      - data/processed/churn_ciclos.csv
    outs:
      - models/churn_model.joblib
      - data/processed/comparacion_modelos_churn.csv
      - reports/figures/07_curvas_roc.png
      - reports/figures/12_matriz_confusion.png
      - reports/figures/13_importancia_features.png

  score_churn:
    cmd: python -m churn_detection.modeling.predict
    deps:
      - churn_detection/modeling/predict.py
      - data/processed/churn_ciclos.csv
      - models/churn_model.joblib
    outs:
      - data/processed/predicciones_churn.csv
