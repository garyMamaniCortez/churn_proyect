stages:
  build_features:
    cmd: python -m churn_detection.features
    deps:
      - churn_detection/features.py
      - churn_detection/config.py
      - data/raw/personas.csv
      - data/raw/inscripciones.csv
      - data/raw/servicios.csv
      - data/raw/registros_acceso.csv
      - data/raw/ventas_servicios.csv
      - data/raw/pagos_pendientes.csv
    outs:
      - data/processed/clientes_segmentacion.csv

  eda:
    cmd: python -m churn_detection.plots
    deps:
      - churn_detection/plots.py
      - data/processed/clientes_segmentacion.csv
    outs:
      - reports/figures/01_missingness.png
      - reports/figures/02_distribuciones_numericas.png
      - reports/figures/03_correlacion.png
      - reports/figures/04_categoricas.png
      - reports/figures/05_uso_vs_recencia.png

  segmentation:
    cmd: python -m churn_detection.modeling.segmentation
    deps:
      - churn_detection/modeling/segmentation.py
      - data/processed/clientes_segmentacion.csv
    outs:
      - data/processed/clientes_segmentados.csv
      - data/processed/perfil_clusters.csv
      - data/processed/comparacion_algoritmos.csv
      - reports/figures/06_seleccion_k.png

  churn_dataset:
    cmd: python -m churn_detection.churn_dataset
    deps:
      - churn_detection/churn_dataset.py
      - churn_detection/membership_utils.py
      - data/raw/personas.csv
      - data/raw/inscripciones.csv
      - data/raw/servicios.csv
      - data/raw/registros_acceso.csv
      - data/raw/ventas_servicios.csv
    outs:
      - data/processed/churn_ciclos.csv
