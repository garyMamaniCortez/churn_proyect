[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "churn_detection"
version = "0.0.1"
description = "Proyecto de deteccion de churn para clientes de un gimnasio"
authors = [
  { name = "Gary Mamani" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
requires-python = ">=3.10.0"


[tool.ruff]
line-length = 99
src = ["churn_detection"]
include = ["pyproject.toml", "churn_detection/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["churn_detection"]
force-sort-within-sections = true

